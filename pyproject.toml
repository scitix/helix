[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparse-rl"
version = "0.1.0"
description = "Sparse weight statistics and hooks for Megatron / Slime / SGLang"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sparse_update", "offline"]

# ---- Ruff: lint + format ----
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["sparse_update", "offline"]
extend-exclude = [
    "**/convert copy.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific
]
ignore = [
    "E501",  # line length (handled by format where possible)
    "B008",  # function calls in argument defaults (common in ML configs)
]

# Chinese report copy uses fullwidth punctuation (RUF001); ASCII-only rule is noisy here.
[tool.ruff.lint.per-file-ignores]
"offline/report_document.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["sparse_update", "offline"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
